<svg width="1000" height="10" viewBox="0 0 1000 10" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="">
  <defs>
    <linearGradient id="dGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#10B981" stop-opacity="0"/>
      <stop offset="0.22" stop-color="#10B981"/>
      <stop offset="0.5" stop-color="#F59E0B"/>
      <stop offset="0.78" stop-color="#14B8A6"/>
      <stop offset="1" stop-color="#14B8A6" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="dShimmer" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="dClip"><rect x="0" y="4" width="1000" height="2" rx="1"/></clipPath>
  </defs>
  <rect x="0" y="4" width="1000" height="2" rx="1" fill="url(#dGrad)"/>
  <g clip-path="url(#dClip)">
    <rect x="-180" y="4" width="180" height="2" fill="url(#dShimmer)">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="1360 0" dur="3.6s" repeatCount="indefinite"/>
    </rect>
  </g>
  <rect x="-3" y="-3" width="6" height="6" fill="#F59E0B" transform="translate(500,5) rotate(45)">
    <animate attributeName="opacity" values="0.55;1;0.55" dur="3s" repeatCount="indefinite"/>
  </rect>
</svg>
